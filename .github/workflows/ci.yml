name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e . pytest
      - name: Test
        run: PYTHONPATH=. pytest -q
      - name: Benchmark gate
        run: PYTHONPATH=. python -m ei.cli benchmark
