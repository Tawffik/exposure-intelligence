[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-intelligence"
version = "0.2.0"
description = "Evidence-driven information-exposure intelligence for authorized targets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Exposure Intelligence" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
ei = "ei.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ei*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"